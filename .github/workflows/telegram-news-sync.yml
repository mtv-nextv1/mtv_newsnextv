name: Telegram news sync
on:
  push:
    paths:
      - ".github/workflows/telegram-news-sync.yml"
      - "scripts/sync_telegram.py"
      - "news.json"
      - "telegram-cursor.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-news-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Import channel posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync_telegram.py
      - name: Commit news feed
        run: |
          if ! git diff --quiet -- news.json telegram-cursor.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json telegram-cursor.json
            git commit -m "Sync Telegram news"
            git push
          fi
