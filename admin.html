<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTV Studio — Админка</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#17171f;--line:#343440;--pink:#ff3e9d;--lime:#d6ff35;--muted:#aaa9b6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f6fa;font:15px/1.5 Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#24242d;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}button.hot{background:var(--pink);color:#100810;border:0}a{color:var(--lime)}.wrap{max-width:1100px;margin:auto;padding:22px}.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:1000;font-size:28px;letter-spacing:-2px}.logo i{color:var(--pink);font-style:normal}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button.active{border-color:var(--pink);color:var(--pink)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:12px;background:#09090d;border:1px solid var(--line);border-radius:9px;color:white}.field textarea{min-height:90px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.login{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--lime);color:#111;padding:12px 18px;border-radius:50px;font-weight:900;display:none;z-index:30}.toast.show{display:block}.badge{color:var(--lime);font-size:12px;font-weight:900}@media(max-width:600px){.wrap{padding:14px}.panel{padding:16px}}
</style></head><body><main class="wrap">
<header class="bar"><div><div class="logo">MTV<i>.</i> STUDIO</div><div class="muted">Панель управления контентом</div></div><div><a href="./">← Вернуться на сайт</a> <button onclick="logout()">Выйти</button></div></header>
<div id="app" hidden>
<div class="tabs"><button data-tab="overview" class="active">Обзор</button><button data-tab="content">Главная</button><button data-tab="news">Новости</button><button data-tab="settings">Настройки</button><button data-tab="staff" id="staffTab">Сотрудники</button></div>
<section id="view"></section>
</div>
<div id="loginPrompt" class="panel"><h1>Доступ к панели управления</h1><p class="muted">Войдите под своей учётной записью сотрудника.</p><button class="hot" onclick="document.getElementById('login').classList.add('open')">Войти в админ-панель</button></div>
</main>
<div class="modal" id="login"><form class="login" id="loginForm"><div class="logo">MTV<i>.</i></div><h2>Вход в редакцию</h2><div class="field"><label>Логин</label><input id="username" required autocomplete="username" value=""></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><button class="hot" type="submit" style="width:100%">ВОЙТИ ↗</button><button type="button" style="width:100%;margin-top:8px" onclick="document.getElementById('login').classList.remove('open')">Отмена</button></form></div><div class="toast" id="toast"></div>
<script>
const DEFAULTS={heroTag:'MTV ORIGINALS · 2026',heroTitle:'ГРОМЧЕ.\nСМЕЛЕЕ.\nБЛИЖЕ.',heroText:'Музыка, люди и истории, которые задают настроение. Заходи в новый ритм MTV Россия.',aboutText:'MTV — пространство музыки и поп-культуры.',footerText:'Музыка. Культура. Сейчас.',email:'hello@mtv.example',copyright:'© 2026 MTV Россия',news:[],programs:[],team:[]};
let data=loadData(),activeTab='overview',authenticated=false,currentUser=null;
function loadData(){try{const saved=JSON.parse(localStorage.getItem('mtvData')||'{}');return {...DEFAULTS,...saved,news:Array.isArray(saved.news)?saved.news:[],programs:Array.isArray(saved.programs)?saved.programs:[],team:Array.isArray(saved.team)?saved.team:[]}}catch(e){return {...DEFAULTS}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function save(){localStorage.setItem('mtvData',JSON.stringify(data));notify('Сохранено в этом браузере');}
function field(id,label,value,area=false){return '<div class="field"><label>'+label+'</label>'+(area?'<textarea id="'+id+'">'+esc(value)+'</textarea>':'<input id="'+id+'" value="'+esc(value)+'">')+'</div>'}
const ROLES=['Создатель','Админ','Редактор','Модератор'];
const ROLE_ACCESS={'Создатель':['overview','content','news','settings','staff'],'Админ':['overview','content','news','settings'],'Редактор':['overview','content','news'],'Модератор':['overview','news']};
function loadStaff(){try{const users=JSON.parse(localStorage.getItem('mtvStaff')||'null');if(Array.isArray(users)&&users.length)return users}catch(e){}const starter=[{id:'creator-root',name:'Создатель',username:'MTVA',password:'MTVA',role:'Создатель'}];localStorage.setItem('mtvStaff',JSON.stringify(starter));return starter}
let staff=loadStaff();
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const user=staff.find(x=>String(x.username).toLowerCase()===username&&x.password===password);if(!user){notify('Неверный логин или пароль');return}currentUser={id:user.id,name:user.name,username:user.username,role:user.role};authenticated=true;sessionStorage.setItem('mtvAdminAuthenticated','yes');sessionStorage.setItem('mtvAdminRole',user.role);sessionStorage.setItem('mtvAdminUser',user.username);document.getElementById('login').classList.remove('open');document.getElementById('loginPrompt').hidden=true;document.getElementById('app').hidden=false;applyPermissions();render();});
function logout(){authenticated=false;sessionStorage.removeItem('mtvAdminAuthenticated');document.getElementById('app').hidden=true;document.getElementById('loginPrompt').hidden=false;document.getElementById('login').classList.remove('open')}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){activeTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}});
function can(permission){return !!currentUser&&(ROLE_ACCESS[currentUser.role]||[]).includes(permission)}
function applyPermissions(){document.querySelectorAll('[data-tab]').forEach(b=>{b.hidden=!can(b.dataset.tab)});if(!can(activeTab))activeTab='overview';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));const who=document.getElementById('currentUser');if(who)who.textContent=currentUser?currentUser.name+' · '+currentUser.role:''}
function render(){const v=document.getElementById('view');if(!can(activeTab))activeTab='overview';if(activeTab==='overview'){v.innerHTML='<div class="panel"><h2>Здравствуйте, '+esc(currentUser?currentUser.name:'сотрудник')+'!</h2><p class="muted">Ваша роль: '+esc(currentUser?currentUser.role:'')+'</p></div><div class="grid"><div class="panel"><div class="muted">Новостей в браузере</div><h1>'+data.news.length+'</h1></div><div class="panel"><div class="muted">Проектов</div><h1>'+data.programs.length+'</h1></div></div>'}if(activeTab==='content'){v.innerHTML='<div class="panel"><h2>Главная страница</h2>'+field('heroTag','Надзаголовок',data.heroTag)+field('heroTitle','Заголовок',data.heroTitle,true)+field('heroText','Описание',data.heroText,true)+field('aboutText','О канале',data.aboutText,true)+field('footerText','Текст подвала',data.footerText,true)+'<button class="hot" onclick="saveFields(\'heroTag heroTitle heroText aboutText footerText\')">Сохранить поля</button></div><div class="panel"><h2>Контакты</h2>'+field('email','Email',data.email)+field('copyright','Копирайт',data.copyright)+'<button class="hot" onclick="saveFields(\'email copyright\')">Сохранить контакты</button></div>'}if(activeTab==='news'){v.innerHTML='<div class="panel"><h2>Новости</h2>'+field('nCategory','Рубрика','MTV NEWS')+field('nTitle','Заголовок','')+field('nBody','Текст','',true)+field('nUrl','Ссылка на публикацию','')+(currentUser.role!=='Модератор'?'<button class="hot" onclick="addNews()">Добавить новость</button>':'')+' <button onclick="loadTelegram()">Импортировать ленту</button></div><div class="panel"><h2>Публикации ('+data.news.length+')</h2>'+(data.news.length?data.news.map((n,i)=>'<div class="row"><div><b>'+esc(n.title||'Без заголовка')+'</b><div class="muted">'+esc(n.category||'MTV NEWS')+' · '+esc(n.date||'')+'</div></div>'+(['Создатель','Админ','Модератор'].includes(currentUser.role)?'<button onclick="deleteNews('+i+')">Удалить</button>':'')+'</div>').join(''):'<p class="muted">Пока нет записей.</p>')+'</div>'}if(activeTab==='settings'){v.innerHTML='<div class="panel"><h2>Настройки</h2><button onclick="exportData()">Экспортировать JSON</button> <label>Импорт JSON <input type="file" accept=".json,application/json" onchange="importData(event)"></label></div><div class="panel"><h2>Технические работы</h2><button onclick="toggleMaintenance()">Переключить локальный предпросмотр</button></div>'}if(activeTab==='staff'){v.innerHTML='<div class="panel"><h2>Управление сотрудниками</h2><p class="muted">Здесь можно добавлять сотрудников и назначать роли.</p><button class="hot" onclick="showStaffForm()">Добавить сотрудника</button></div><div id="staffList" class="panel"></div>';renderStaffList()}}function saveFields(ids){ids.split(' ').forEach(id=>{const el=document.getElementById(id);if(el)data[id]=el.value});save();render()}
function addNews(){const title=document.getElementById('nTitle').value.trim();if(!title){notify('Введите заголовок');return}data.news.unshift({id:'manual-'+Date.now(),category:document.getElementById('nCategory').value||'MTV NEWS',title,body:document.getElementById('nBody').value,url:document.getElementById('nUrl').value,date:new Date().toISOString().slice(0,10),art:'MTV',color:'blue'});save();render()}
function deleteNews(i){data.news.splice(i,1);save();render()}
async function loadTelegram(){try{const r=await fetch('./news.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const payload=await r.json();const posts=Array.isArray(payload)?payload:(payload.news||payload.posts||[]);const existing=new Set(data.news.map(n=>String(n.url||n.id||n.title).toLowerCase()));let added=0;for(const p of posts){const n={id:p.id||p.message_id||p.url||p.link||'',url:p.url||p.link||'',category:p.category||p.channel||p.source||'TELEGRAM',date:p.date||p.published_at||'',title:p.title||p.text||p.message||p.caption||'',body:p.body||p.description||p.text||p.message||p.caption||'',art:'TG',color:'blue'};const key=String(n.url||n.id||n.title).toLowerCase();if(n.title&&!existing.has(key)){data.news.push(n);existing.add(key);added++}}data.news=data.news.slice(0,200);save();render();notify('Лента загружена; добавлено: '+added)}catch(e){notify('Не удалось загрузить news.json: '+e.message)}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='mtv-content.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);data={...DEFAULTS,...obj,news:Array.isArray(obj.news)?obj.news:[]};save();render();notify('Импортировано')}catch(err){notify('Ошибка JSON')}};reader.readAsText(file)}
function toggleMaintenance(){const on=localStorage.getItem('mtvMaintenanceMode')!=='on';localStorage.setItem('mtvMaintenanceMode',on?'on':'off');notify(on?'Режим включён в этом браузере':'Режим выключен')}
if(sessionStorage.getItem('mtvAdminAuthenticated')==='yes'){authenticated=true;document.getElementById('loginPrompt').hidden=true;document.getElementById('app').hidden=false;render()}
const params=new URLSearchParams(location.search);if(params.get('login')==='1')document.getElementById('login').classList.add('open');
</script></body></html>
